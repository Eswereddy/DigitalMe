<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Me</title>
<style>:root{color-scheme:light dark}body{font:16px/1.5 system-ui,sans-serif;max-width:640px;margin:0 auto;padding:24px}h1{margin:0}#c{min-height:240px;margin:16px 0}.m{padding:8px 12px;border-radius:12px;margin:6px 0;white-space:pre-wrap;background:#8883}.u{background:#6366f1;color:#fff;margin-left:20%}.r{display:flex;gap:8px}input{flex:1;padding:10px;border-radius:10px;border:1px solid #8886;font:inherit}button{padding:10px 16px;border-radius:10px;border:0;background:#6366f1;color:#fff;font:inherit}small{opacity:.7}</style></head><body>
<h1 id="n">Digital Me</h1><small>AI representative. Answers only from information the owner chose to share.</small><div id="t"></div><div id="c"></div>
<div class="r"><input id="q" placeholder="Ask about their projects, skills, background..." onkeydown="if(event.key==='Enter')go()"><button onclick="go()">Ask</button></div>
<script>const S=location.pathname.split('/').pop(),$=i=>document.getElementById(i);
const add=(c,t)=>{const d=document.createElement('div');d.className='m '+c;d.textContent=t;$('c').appendChild(d)};
fetch('/public/'+S).then(r=>r.ok?r.json():Promise.reject()).then(d=>{$('n').textContent='Digital Me · '+d.name;document.title='Digital Me · '+d.name;$('t').innerHTML=d.topics.length?'<small>Shared topics: '+d.topics.map(x=>x.replace(/[<>&]/g,'')).join(', ')+'</small>':''}).catch(()=>{$('n').textContent='Link not found'});
async function go(){const q=$('q').value.trim();if(!q)return;$('q').value='';add('u',q);try{const r=await fetch('/public/'+S+'/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:q})});const d=await r.json();add('',d.answer||d.error||'Error')}catch(e){add('','Network error')}}</script></body></html>
